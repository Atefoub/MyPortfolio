<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Fond gradient sombre comme le dark mode du portfolio -->
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#35392e"/>
      <stop offset="100%" stop-color="#42463c"/>
    </linearGradient>

    <!-- Accent turquoise -->
    <linearGradient id="accent" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#99c6c4"/>
      <stop offset="100%" stop-color="#83a08b"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond arrondi -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Bordure subtile -->
  <rect width="32" height="32" rx="8" fill="none" stroke="#99c6c4" stroke-width="1" opacity="0.25"/>

  <!-- Lettre A stylisée : deux diagonales + barre centrale -->
  <!-- Jambe gauche de A -->
  <line x1="5" y1="24" x2="11.5" y2="8" stroke="url(#accent)" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Jambe droite de A -->
  <line x1="11.5" y1="8" x2="15" y2="17" stroke="url(#accent)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Barre du A -->
  <line x1="7.2" y1="18" x2="13.5" y2="18" stroke="#99c6c4" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>

  <!-- Lettre M stylisée : trait vertical + deux pics -->
  <!-- Jambe gauche M -->
  <line x1="16" y1="24" x2="16" y2="10" stroke="url(#accent)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Pic gauche M -->
  <line x1="16" y1="10" x2="20" y2="16" stroke="url(#accent)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Pic droit M -->
  <line x1="20" y1="16" x2="24" y2="10" stroke="url(#accent)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Jambe droite M -->
  <line x1="24" y1="10" x2="24" y2="24" stroke="url(#accent)" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Point accent — clin d'œil aux 3 balles de jonglage -->
  <circle cx="28.5" cy="6.5" r="1.6" fill="#99c6c4" opacity="0.9"/>
  <circle cx="28.5" cy="6.5" r="2.8" fill="none" stroke="#99c6c4" stroke-width="0.6" opacity="0.3"/>
</svg>
