<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/MyPortfolio/images/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Antoine Mourin, développeur full-stack à Nantes. Après douze ans en comptabilité, il conçoit des outils qui enlèvent le travail répétitif."
    />
    <title>Antoine Mourin - Portfolio</title>

    <!-- Restauration du path après redirect 404 GitHub Pages -->
    <script>
      (function () {
        var query = window.location.search;
        if (query.startsWith('?p=')) {
          var route = decodeURIComponent(query.slice(3));
          window.history.replaceState(null, '', '/MyPortfolio' + (route || '/'));
        }
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
